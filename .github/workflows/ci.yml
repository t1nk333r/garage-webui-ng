# CI, image publish and signed releases, on GitHub-hosted runners (free and
# unmetered for a public repository).
#
#   - every push to main, every pull request: frontend and backend checks,
#     govulncheck (blocking), pnpm audit (advisory). Only the tests the change
#     can reach run, as decided by .github/scripts/ci-scope.sh; a side the
#     change does not touch is skipped;
#   - main: the multi-arch image, tagged main, latest and sha-<short>;
#   - a v* tag: every test, then the image tagged X.Y.Z, X.Y and X, plus a
#     GitHub release with the signed binaries;
#   - nightly, and on a manual run: every test.
#
# Release assets and their names are a contract with `relsign verify` and the
# in-app updater (contrib/garage-update): do not rename them.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Catches what a narrowed run cannot: a newly published advisory, or a test
  # that depends on a file no scope rule knows it reads.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  # The event is part of the group so the nightly run never cancels a push
  # that is publishing an image, or the other way round.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A newer push to a branch supersedes a running build; a release never is.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Exact patches, in lockstep with the Dockerfile's builder stages. The
  # backend job fails if the Go pins drift apart, because govulncheck judges
  # the standard library of the toolchain it runs under.
  GO_VERSION: "1.27.3"
  NODE_VERSION: "20"
  IMAGE: ghcr.io/${{ github.repository_owner }}/garage-webui-ng

jobs:
  changes:
    name: "Scope: what the change reaches"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      frontend_files: ${{ steps.scope.outputs.frontend_files }}
      backend: ${{ steps.scope.outputs.backend }}
      backend_files: ${{ steps.scope.outputs.backend_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/ci-scope.sh

  frontend:
    name: "Frontend: lint · typecheck · test · build"
    needs: changes
    if: needs.changes.outputs.frontend != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from package.json's "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-blocking: main carries a pre-existing lint backlog. Lint still runs
      # so new violations stay visible.
      - run: pnpm run lint
        continue-on-error: true
      - run: pnpm run typecheck
      - name: Test (${{ needs.changes.outputs.frontend }})
        env:
          SCOPE: ${{ needs.changes.outputs.frontend }}
          FILES: ${{ needs.changes.outputs.frontend_files }}
        run: |
          if [ "$SCOPE" = full ]; then
            pnpm run test
            exit
          fi
          mapfile -t files < <(jq -r '.[]' <<<"$FILES")
          if [ ${#files[@]} -eq 0 ]; then
            echo "No frontend test reaches this change."
            exit
          fi
          # The changed test files, and every test file that imports a changed
          # source at any depth.
          pnpm exec vitest related --run --passWithNoTests "${files[@]}"
      - run: pnpm run build

  backend:
    name: "Backend: build · vet · fmt · test"
    needs: changes
    if: needs.changes.outputs.backend != 'skip'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Go pin matches the Dockerfile
        working-directory: .
        run: |
          if ! grep -q "golang:${GO_VERSION}-alpine" Dockerfile; then
            echo "::error::GO_VERSION ${GO_VERSION} is not the Dockerfile's golang image"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: Test (${{ needs.changes.outputs.backend }})
        env:
          SCOPE: ${{ needs.changes.outputs.backend }}
          FILES: ${{ needs.changes.outputs.backend_files }}
        run: |
          if [ "$SCOPE" = full ]; then
            go test -race ./...
            exit
          fi
          # The changed packages and every package that imports one.
          pkgs=$(jq -r '.[]' <<<"$FILES" | ../.github/scripts/go-affected.sh)
          if [ -z "$pkgs" ]; then
            echo "No Go test reaches this change."
            exit
          fi
          echo "$pkgs"
          mapfile -t list <<<"$pkgs"
          go test -race "${list[@]}"

  govulncheck:
    name: "Security: govulncheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  audit:
    name: "Security: pnpm audit (advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm audit --prod

  image:
    name: Build & push multi-arch image
    needs: [frontend, backend, govulncheck]
    # A side the change does not reach is skipped, not failed.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile's build stages cross-compile; QEMU is only needed for
      # the small per-platform runtime stage.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Garage WebUI-NG
            org.opencontainers.image.description=Modern admin dashboard for Garage S3-compatible object storage.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=garage-webui-ng
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # The binary's version: the tag on a release, "main" otherwise.
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: "Release: signed binaries"
    needs: [frontend, backend, govulncheck]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG but package.json says $PKG"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Build binaries
        working-directory: backend
        run: |
          mkdir -p ../release-artifacts
          rm -rf ui/dist && cp -r ../dist ui/dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
              go build -tags=prod -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "../release-artifacts/garage-webui-ng-linux-$ARCH" .
          done
          cd ../release-artifacts
          sha256sum garage-webui-ng-linux-* > SHA256SUMS
          cat SHA256SUMS
      # relsign reads the key only from the environment, never a flag, so it
      # cannot reach the log or the process table.
      - name: Sign SHA256SUMS
        working-directory: backend
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::the RELEASE_SIGNING_KEY secret is not set; releases must be signed"
            exit 1
          fi
          go run ./cmd/relsign sign \
            -key-env RELEASE_SIGNING_KEY \
            -in ../release-artifacts/SHA256SUMS \
            -out ../release-artifacts/SHA256SUMS.sig
      # Fails before anything is published when the secret is not the private
      # half of the public key compiled into the app: users could not verify
      # such a release.
      - name: Signature verifies against the compiled-in public key
        working-directory: backend
        run: |
          PUB=$(sed -n 's/^var releasePublicKey = "\([0-9a-f]*\)"$/\1/p' release_key.go)
          if [ -z "$PUB" ]; then
            echo "::error::could not read releasePublicKey from backend/release_key.go"
            exit 1
          fi
          go run ./cmd/relsign verify -pub "$PUB" \
            -in ../release-artifacts/SHA256SUMS \
            -sig ../release-artifacts/SHA256SUMS.sig
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/garage-webui-ng-linux-amd64
            release-artifacts/garage-webui-ng-linux-arm64
            release-artifacts/SHA256SUMS
            release-artifacts/SHA256SUMS.sig
          fail_on_unmatched_files: true
          generate_release_notes: true
